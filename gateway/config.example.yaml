# Copy to config.yaml (gitignored) and fill secrets locally.
# Do not bind 8123 / 1900 / 5353 if Home Assistant shares the host.

listen: "0.0.0.0"
port: 8765

# groq | mock | gemini | aipbx | xiaozhi
backend: groq

groq:
  api_key: ""
  stt_model: "whisper-large-v3-turbo"
  llm_model: "openai/gpt-oss-20b"
  voice: "ru-RU-SvetlanaNeural"
  tts_model: "canopylabs/orpheus-v1-english"
  tts_voice: "tara"
  espeak_voice: "ru"
  piper_model: "/opt/s3-kolonka-gw/voices/ru_RU-irina-medium.onnx"
  # Optional HTTP(S) proxy if the gateway host cannot reach api.groq.com.
  proxy: ""

gemini:
  api_key: ""
  model: "gemini-live-2.5-flash-native-audio"

aipbx:
  url: ""
  assistant_id: ""
  token: ""

xiaozhi:
  url: ""
  token: ""
